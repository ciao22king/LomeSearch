name: dist

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build deb and AppImage
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: cd packages/browser && npx electron-builder --linux deb AppImage --config.npmRebuild=false
      - uses: actions/upload-artifact@v4
        with:
          name: lomesearch-linux
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build installer and portable exe
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: cd packages/browser && npx electron-builder --win nsis portable --config.npmRebuild=false
      - uses: actions/upload-artifact@v4
        with:
          name: lomesearch-windows
          path: dist/*.exe
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build dmg and zip
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: cd packages/browser && npx electron-builder --mac --${{ matrix.arch }} --config.npmRebuild=false
      - uses: actions/upload-artifact@v4
        with:
          name: lomesearch-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      LOMESEARCH_KEYSTORE: packages/android/.keystore/lomesearch.jks
      LOMESEARCH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'lomesearch' }}
      LOMESEARCH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'lomesearch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner image ships an SDK, but not necessarily the build-tools d8 in
      # this project needs, so resolve sdkmanager and install what is missing.
      - name: Resolve the Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$(command -v sdkmanager || true)"
          if [ -z "$SM" ]; then SM="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -n1)"; fi
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "SDKMANAGER=$SM"
          } >> "$GITHUB_ENV"
      - name: Install platform and build-tools
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"
      - name: Restore the release keystore when the secret exists
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p "$(dirname "$LOMESEARCH_KEYSTORE")"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$LOMESEARCH_KEYSTORE"
      - name: Test client logic
        run: bash packages/android/test.sh
      - name: Build apk
        run: bash packages/android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lomesearch-android
          path: dist/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          generate_release_notes: true
