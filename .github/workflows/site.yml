name: Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build-web.mjs'
      - 'packages/engine/src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The web edition runs the engine inside the page: site/web/engine.js is a
      # build product, so it is bundled here instead of being committed.
      - name: Build the in-browser engine
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/build-web.mjs

      - name: Check internal links and anchors
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = 'site';
          const pages = ['index.html', '404.html', 'web/index.html'];
          const ids = new Map();
          const files = new Map();
          for (const page of pages) {
            const html = fs.readFileSync(path.join(root, page), 'utf8');
            files.set(page, html);
            ids.set(page, new Set([...html.matchAll(/id="([^"]+)"/g)].map((m) => m[1])));
          }
          const resolveFrom = (page, href) => {
            const base = href.startsWith('/') ? href.slice(1) : path.join(path.dirname(page), href);
            return base.endsWith('/') ? path.join(base, 'index.html') : base;
          };
          const problems = [];
          for (const [page, html] of files) {
            for (const [, href] of html.matchAll(/href="([^"]+)"/g)) {
              if (href.startsWith('#')) {
                const id = href.slice(1);
                if (id && !ids.get(page).has(id)) problems.push(`${page}: missing anchor ${href}`);
              } else if (/^(assets\/|\.\.?\/|web\/|site\.webmanifest$|\.\/$)/.test(href) && !href.startsWith('#')) {
                const target = resolveFrom(page, href.split('#')[0]);
                if (!fs.existsSync(path.join(root, target))) problems.push(`${page}: missing file ${href}`);
              }
            }
            for (const [, src] of html.matchAll(/(?:src|href)="([^"]+\.(?:js|css|svg|png|json))"/g)) {
              const target = resolveFrom(page, src);
              if (!fs.existsSync(path.join(root, target))) problems.push(`${page}: missing asset ${src}`);
            }
          }
          if (problems.length) {
            console.error(problems.join('\n'));
            process.exit(1);
          }
          console.log('site links ok');
          NODE

      # Pages cannot be switched on by a workflow token: the site owner does it
      # once in Settings -> Pages -> Source: GitHub Actions. Until then the job
      # stays green and skips the deployment instead of failing on every push.
      - name: Check that Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "${{ github.api_url }}/repos/${{ github.repository }}/pages")
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages not enabled::Enable GitHub Pages in Settings -> Pages -> Source: GitHub Actions to publish site/."
          fi

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.pages.outputs.enabled == 'true'
