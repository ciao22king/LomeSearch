<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; font-src 'self';">
<title>LomeSearch</title>
<link rel="stylesheet" href="chrome.css">
</head>
<body>
<div id="chrome" class="chrome">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <span class="brand" title="LomeSearch">LomeSearch</span>
      <span class="private-badge" id="private-badge" hidden>Private</span>
      <button class="icon-btn new-tab" id="new-tab" title="New tab (Ctrl+T)" aria-label="New tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>

    <div class="tabs" id="tabs" role="tablist" aria-label="Tabs"></div>

    <div class="sidebar-foot">
      <span class="tab-summary" id="tab-summary">0 tabs</span>
      <button class="ghost-btn" id="freeze-idle" title="Freeze every tab except this one">Freeze idle</button>
    </div>
  </aside>

  <div class="main">
    <header class="toolbar">
      <div class="nav-group">
        <button class="icon-btn" id="back" title="Back (Alt+Left)" aria-label="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button class="icon-btn" id="forward" title="Forward (Alt+Right)" aria-label="Forward">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <button class="icon-btn" id="reload" title="Reload (Ctrl+R)" aria-label="Reload">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
        </button>
        <button class="icon-btn" id="home" title="Home (Alt+Home)" aria-label="Home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
        </button>
      </div>

      <form class="omnibox" id="omnibox-form" autocomplete="off">
        <span class="security" id="security" title="Page security">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        </span>
        <input id="omnibox" type="text" spellcheck="false" placeholder="Search the local index or enter an address" aria-label="Address bar" role="combobox" aria-expanded="false" aria-controls="suggestions">
        <button type="button" class="star" id="star" title="Bookmark this page (Ctrl+D)" aria-label="Bookmark this page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l2.4 5.1 5.6.7-4.1 3.9 1 5.5-4.9-2.7-4.9 2.7 1-5.5L4 9.8l5.6-.7z"/></svg>
        </button>
      </form>

      <div class="tool-group">
        <button class="icon-btn badge-host" id="shield" title="Privacy for this page" aria-label="Privacy">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 4.4-2.9 8.2-7 9.5C7.9 19.2 5 15.4 5 11V6z"/><path d="M9.5 11.8l1.8 1.8 3.4-3.6"/></svg>
          <span class="badge" id="shield-count" hidden>0</span>
        </button>
        <button class="icon-btn" id="extensions" title="Extensions" aria-label="Extensions">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6v3a2 2 0 1 0 4 0h1v5h-3a2 2 0 1 0 0 4h3v5h-5v-3a2 2 0 1 0-4 0v3H4v-5h3a2 2 0 1 0 0-4H4V7h5z"/></svg>
        </button>
        <button class="icon-btn badge-host" id="downloads" title="Downloads (Ctrl+J)" aria-label="Downloads">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19h14"/></svg>
          <span class="badge" id="downloads-count" hidden>0</span>
        </button>
        <button class="icon-btn" id="menu" title="Menu" aria-label="Menu" aria-haspopup="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5.5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="18.5" r="1.4"/></svg>
        </button>
      </div>

      <div class="window-controls">
        <button class="win-btn" id="win-min" title="Minimize" aria-label="Minimize">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
        </button>
        <button class="win-btn" id="win-max" title="Maximize" aria-label="Maximize">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
        </button>
        <button class="win-btn win-close" id="win-close" title="Close" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </header>
  </div>

  <div class="overlay" id="overlay" hidden></div>

  <div class="panel suggestions" id="suggestions" role="listbox" hidden></div>

  <div class="panel findbar" id="findbar" hidden>
    <input id="find-input" type="text" placeholder="Find in page" aria-label="Find in page">
    <span class="find-count" id="find-count">0/0</span>
    <button class="icon-btn small" id="find-prev" title="Previous" aria-label="Previous">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14l6-6 6 6"/></svg>
    </button>
    <button class="icon-btn small" id="find-next" title="Next" aria-label="Next">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10l6 6 6-6"/></svg>
    </button>
    <button class="icon-btn small" id="find-close" title="Close" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="panel menu-panel" id="menu-panel" hidden role="menu"></div>

  <div class="panel downloads-panel" id="downloads-panel" hidden></div>

  <div class="panel shield-panel" id="shield-panel" hidden></div>

  <div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
</div>
<script src="chrome.js"></script>
</body>
</html>
